[package]
name = "jacarta"
version = "1.1.6"
edition = "2021"

[dependencies]
aes-gcm = "0.11.0"
bincode = "1.3.3"
cryptoki = "0.12.0"
eframe = { version = "0.29.0", features = ["default"] }
pkcs8 = "0.11.0"
rand = "0.10.2"
raw-window-handle = "0.6.2"
rsa = "0.9.10"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
spki = "0.8.0"
tar = "0.4"
tempfile = "3"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Diagnostics_Debug"] }
